<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="100%" height="100%">
  <defs>
    <linearGradient id="bgSky" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#05060A" />
      <stop offset="50%" stop-color="#0E091C" />
      <stop offset="75%" stop-color="#1A0D36" />
      <stop offset="100%" stop-color="#070913" />
    </linearGradient>
    <radialGradient id="sunGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FF007F" stop-opacity="0.8" />
      <stop offset="50%" stop-color="#8A2BE2" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="gridLineGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#00F0FF" stop-opacity="0" />
      <stop offset="40%" stop-color="#00F0FF" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#00F0FF" stop-opacity="0.9" />
    </linearGradient>
  </defs>

  <!-- Sky Background -->
  <rect width="1920" height="1080" fill="url(#bgSky)" />

  <!-- Distant Glowing Cyber Sun / Nebula -->
  <circle cx="960" cy="540" r="380" fill="url(#sunGlow)" />

  <!-- Stars -->
  <g fill="#FFFFFF" opacity="0.6">
    <circle cx="200" cy="150" r="1.5" />
    <circle cx="450" cy="280" r="1.2" />
    <circle cx="820" cy="90" r="1.8" />
    <circle cx="1120" cy="180" r="1.4" />
    <circle cx="1400" cy="80" r="2.0" />
    <circle cx="1650" cy="240" r="1.0" />
    <circle cx="320" cy="420" r="1.6" />
    <circle cx="1720" cy="380" r="1.5" />
  </g>

  <!-- Horizon Line with Glow -->
  <line x1="0" y1="620" x2="1920" y2="620" stroke="#FF007F" stroke-width="3" opacity="0.8" />

  <!-- Perspective Grid -->
  <g stroke="url(#gridLineGrad)" stroke-width="1.5">
    <!-- Converging Perspective Lines to vanishing point (960, 620) -->
    <line x1="960" y1="620" x2="0" y2="1080" />
    <line x1="960" y1="620" x2="240" y2="1080" />
    <line x1="960" y1="620" x2="480" y2="1080" />
    <line x1="960" y1="620" x2="720" y2="1080" />
    <line x1="960" y1="620" x2="880" y2="1080" />
    <line x1="960" y1="620" x2="960" y2="1080" />
    <line x1="960" y1="620" x2="1040" y2="1080" />
    <line x1="960" y1="620" x2="1200" y2="1080" />
    <line x1="960" y1="620" x2="1440" y2="1080" />
    <line x1="960" y1="620" x2="1680" y2="1080" />
    <line x1="960" y1="620" x2="1920" y2="1080" />

    <!-- Horizontal Lines moving closer to camera -->
    <line x1="0" y1="640" x2="1920" y2="640" opacity="0.2" />
    <line x1="0" y1="670" x2="1920" y2="670" opacity="0.3" />
    <line x1="0" y1="720" x2="1920" y2="720" opacity="0.4" />
    <line x1="0" y1="790" x2="1920" y2="790" opacity="0.6" />
    <line x1="0" y1="880" x2="1920" y2="880" opacity="0.75" />
    <line x1="0" y1="990" x2="1920" y2="990" opacity="0.9" />
  </g>
</svg>
