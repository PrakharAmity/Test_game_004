<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <linearGradient id="gemGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF4081" />
      <stop offset="50%" stop-color="#E040FB" />
      <stop offset="100%" stop-color="#7C4DFF" />
    </linearGradient>
    <filter id="gemGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="3.5" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>
  <!-- Diamond Shape Facets -->
  <polygon points="50,14 82,38 50,86 18,38" fill="url(#gemGrad)" stroke="#FFFFFF" stroke-width="1.5" filter="url(#gemGlow)" />
  <!-- Facet lines -->
  <polygon points="34,38 66,38 50,86" fill="#800080" opacity="0.35" />
  <polygon points="50,14 34,38 66,38" fill="#FFFFFF" opacity="0.4" />
  <line x1="50" y1="14" x2="18" y2="38" stroke="#FFFFFF" stroke-width="1.5" />
  <line x1="50" y1="14" x2="82" y2="38" stroke="#FFFFFF" stroke-width="1.5" />
  <!-- Sparkle Glint -->
  <circle cx="42" cy="30" r="3" fill="#FFFFFF" />
</svg>
