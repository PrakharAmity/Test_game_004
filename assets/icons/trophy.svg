<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF176" />
      <stop offset="50%" stop-color="#FFD700" />
      <stop offset="100%" stop-color="#FF9800" />
    </linearGradient>
    <filter id="goldGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>
  <!-- Cup Handles -->
  <path d="M 24 30 C 12 30, 12 56, 28 56" fill="none" stroke="url(#goldGrad)" stroke-width="4" filter="url(#goldGlow)" />
  <path d="M 76 30 C 88 30, 88 56, 72 56" fill="none" stroke="url(#goldGrad)" stroke-width="4" filter="url(#goldGlow)" />
  <!-- Cup Body -->
  <path d="M 26 22 L 74 22 C 74 48, 58 60, 50 64 C 42 60, 26 48, 26 22 Z" fill="url(#goldGrad)" stroke="#FFA000" stroke-width="2" filter="url(#goldGlow)" />
  <!-- Stem & Base -->
  <rect x="46" y="64" width="8" height="14" fill="#FFB300" />
  <polygon points="32,84 68,84 62,78 38,78" fill="url(#goldGrad)" />
  <rect x="30" y="84" width="40" height="6" rx="2" fill="#212121" stroke="#FFD700" stroke-width="1" />
  <!-- Star on Cup -->
  <polygon points="50,30 53,38 61,38 55,44 57,52 50,47 43,52 45,44 39,38 47,38" fill="#FFFFFF" />
</svg>
