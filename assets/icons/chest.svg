<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <linearGradient id="chestBody" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#2D124D" />
      <stop offset="100%" stop-color="#0E051D" />
    </linearGradient>
    <linearGradient id="chestGold" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFDF00" />
      <stop offset="50%" stop-color="#FFA500" />
      <stop offset="100%" stop-color="#FFD700" />
    </linearGradient>
    <filter id="neonBurst" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>
  <!-- Chest Base -->
  <rect x="18" y="44" width="64" height="38" rx="5" fill="url(#chestBody)" stroke="url(#chestGold)" stroke-width="3" />
  <!-- Chest Lid (Arch) -->
  <path d="M 16 44 C 16 26, 84 26, 84 44 Z" fill="url(#chestBody)" stroke="url(#chestGold)" stroke-width="3" />
  <!-- Gold Bands -->
  <line x1="34" y1="28" x2="34" y2="82" stroke="url(#chestGold)" stroke-width="3.5" />
  <line x1="66" y1="28" x2="66" y2="82" stroke="url(#chestGold)" stroke-width="3.5" />
  <!-- Cyber Rune Core Lock -->
  <circle cx="50" cy="46" r="8" fill="#00F0FF" filter="url(#neonBurst)" />
  <circle cx="50" cy="46" r="4" fill="#FFFFFF" />
  <!-- Exploding Ray Particles -->
  <polygon points="50,12 52,22 48,22" fill="#00F0FF" filter="url(#neonBurst)" />
  <polygon points="20,18 28,26 25,29" fill="#FF007F" filter="url(#neonBurst)" />
  <polygon points="80,18 75,29 72,26" fill="#FF007F" filter="url(#neonBurst)" />
</svg>
