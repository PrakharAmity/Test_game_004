<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="bladeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="50%" stop-color="#06B6D4" />
      <stop offset="100%" stop-color="#0284C7" />
    </linearGradient>
    <filter id="bladeGlow">
      <feGaussianBlur stdDeviation="2.5" result="glow"/>
      <feMerge>
        <feMergeNode in="glow"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <g filter="url(#bladeGlow)">
    <!-- Diagonal Blade -->
    <path d="M52 8 L56 12 L24 44 L16 44 L16 36 Z" fill="url(#bladeGrad)" stroke="#BAE6FD" stroke-width="1.5"/>
    <line x1="22" y1="38" x2="52" y2="8" stroke="#FFFFFF" stroke-width="1.5"/>
    <!-- Guard -->
    <line x1="12" y1="42" x2="22" y2="52" stroke="#FBBF24" stroke-width="4" stroke-linecap="round"/>
    <!-- Hilt & Pommel -->
    <line x1="15" y1="47" x2="9" y2="53" stroke="#9333EA" stroke-width="3" stroke-linecap="round"/>
    <circle cx="7" cy="55" r="2.5" fill="#FBBF24"/>
  </g>
</svg>
