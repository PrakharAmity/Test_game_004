<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <radialGradient id="coinGrad" cx="40%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#FFF380" />
      <stop offset="60%" stop-color="#FFB300" />
      <stop offset="100%" stop-color="#FF8F00" />
    </radialGradient>
    <filter id="coinGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>
  <circle cx="50" cy="50" r="42" fill="url(#coinGrad)" stroke="#FFA000" stroke-width="4" filter="url(#coinGlow)" />
  <circle cx="50" cy="50" r="32" fill="none" stroke="#FFE082" stroke-width="2" stroke-dasharray="4,2" />
  <!-- Pixel Star in Center -->
  <polygon points="50,28 55,42 69,42 58,51 62,65 50,56 38,65 42,51 31,42 45,42" fill="#FFFFFF" opacity="0.95" />
</svg>
