<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <linearGradient id="valkGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00F0FF" />
      <stop offset="50%" stop-color="#8A2BE2" />
      <stop offset="100%" stop-color="#FF007F" />
    </linearGradient>
    <filter id="valkGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <circle cx="50" cy="50" r="46" fill="#0A0C16" stroke="url(#valkGrad)" stroke-width="3" filter="url(#valkGlow)" />
  <!-- Cyber Wing Accents -->
  <path d="M 20 40 L 8 26 L 24 32 Z" fill="#00F0FF" opacity="0.8" />
  <path d="M 80 40 L 92 26 L 76 32 Z" fill="#00F0FF" opacity="0.8" />
  <!-- Helmet Base -->
  <polygon points="34,22 66,22 74,48 64,78 50,86 36,78 26,48" fill="#141829" stroke="#00F0FF" stroke-width="2" />
  <!-- Glowing Neon Visor -->
  <polygon points="32,44 68,44 62,56 38,56" fill="url(#valkGrad)" filter="url(#valkGlow)" />
  <line x1="30" y1="50" x2="70" y2="50" stroke="#FFFFFF" stroke-width="1.5" opacity="0.9" />
  <!-- Crown Crest -->
  <polygon points="46,14 54,14 52,24 48,24" fill="#FFD700" filter="url(#valkGlow)" />
</svg>
